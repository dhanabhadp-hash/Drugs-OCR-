services:
  - type: web
    name: drugs-ocr
    env: node
    plan: free
    autoDeploy: true
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: GAS_WEBAPP_URL
        sync: false
